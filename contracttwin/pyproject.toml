[project]
name = "contracttwin"
version = "0.1.0"
description = "Source-grounded EMS agreement reader. Facts cite the contract text they came from."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "pypdf>=5.1,<7",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.12,<1",
  "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
]

[project.scripts]
contracttwin = "contracttwin.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore:starlette.testclient:UserWarning",
]
