name: ContractTwin Release Diagnostics

on:
  workflow_run:
    workflows:
      - ContractTwin Release Attestation
    types:
      - completed

permissions:
  contents: write
  actions: read

jobs:
  diagnose:
    if: github.event.workflow_run.conclusion != 'success' && github.event.workflow_run.head_branch == 'build/ems-commercial-legal-cockpit'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/ems-commercial-legal-cockpit
      - name: Capture failed jobs and steps
        shell: bash
        run: |
          jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs" --jq '[.jobs[] | {name,status,conclusion,failedSteps:[.steps[] | select(.conclusion=="failure") | .name]}]')"
          cat > contracttwin-release-diagnostics.json <<EOF
          {
            "testedSourceSha": "${{ github.event.workflow_run.head_sha }}",
            "workflowRunId": "${RUN_ID}",
            "workflowConclusion": "${{ github.event.workflow_run.conclusion }}",
            "jobs": ${jobs},
            "recordedAtUtc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
      - name: Commit diagnostics
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add contracttwin-release-diagnostics.json
          git commit -m 'ci: record ContractTwin release diagnostics' || exit 0
          git push origin HEAD:build/ems-commercial-legal-cockpit
