name: ContractTwin core

on:
  push:
    paths:
      - "contracttwin/**"
      - ".github/workflows/contracttwin-core.yml"
  pull_request:
    paths:
      - "contracttwin/**"
      - ".github/workflows/contracttwin-core.yml"

permissions:
  contents: read

jobs:
  test:
    name: Reading service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracttwin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install the package
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest --tb=short

  image:
    name: Dockerfile builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build the image
        run: docker build -t contracttwin-core contracttwin
