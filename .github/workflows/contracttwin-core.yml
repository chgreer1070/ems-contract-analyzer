name: ContractTwin core

on:
  # Every update of main runs these checks, including a workflow-only commit.
  # `.github/workflows/**` stays in the filter so a workflow edit cannot be skipped.
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "commercial-legal-cockpit/**"
      - "contracttwin/**"
      - "**/*"
      - "*"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "commercial-legal-cockpit/**"
      - "contracttwin/**"
      - "**/*"
      - "*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Reading service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracttwin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install the package
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest --tb=short

  image:
    name: Dockerfile builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build the image
        run: docker build -t contracttwin-core contracttwin

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Smoke test the running container
        working-directory: contracttwin
        env:
          CONTRACTTWIN_IMAGE: contracttwin-core
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pytest tests/test_container_smoke.py -o addopts= --tb=short
