name: Commercial Legal Cockpit - Dependency Lock

on:
  push:
    branches:
      - build/ems-commercial-legal-cockpit
    paths:
      - 'commercial-legal-cockpit/package.json'
      - '.github/workflows/commercial-legal-cockpit-lock.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: commercial-legal-cockpit-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock:
    name: Resolve and commit package-lock.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve exact dependency graph
        working-directory: commercial-legal-cockpit
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile when changed
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add commercial-legal-cockpit/package-lock.json
          if git diff --cached --quiet; then
            echo 'package-lock.json is current.'
          else
            git commit -m 'chore: lock cockpit production dependencies'
            git push origin HEAD:build/ems-commercial-legal-cockpit
          fi
