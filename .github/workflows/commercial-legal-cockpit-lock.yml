name: Commercial Legal Cockpit - Dependency Lock

on:
  push:
    branches:
      - main
      - build/ems-commercial-legal-cockpit
    paths:
      - 'commercial-legal-cockpit/package.json'
      - 'commercial-legal-cockpit/package-lock.json'
      - '.github/workflows/commercial-legal-cockpit-lock.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'commercial-legal-cockpit/package.json'
      - 'commercial-legal-cockpit/package-lock.json'
      - '.github/workflows/commercial-legal-cockpit-lock.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: commercial-legal-cockpit-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock:
    name: Verify committed package-lock.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: commercial-legal-cockpit/package-lock.json
      - name: Verify locked dependency graph without repository writes
        working-directory: commercial-legal-cockpit
        run: npm ci --ignore-scripts --no-audit --no-fund
