name: Commercial Legal Cockpit

on:
  # Every update of main runs validation, including a workflow-only commit.
  # `.github/workflows/**` stays in the filter so a workflow edit cannot be skipped.
  push:
    branches:
      - main
      - build/ems-commercial-legal-cockpit
    paths:
      - '.github/workflows/**'
      - 'commercial-legal-cockpit/**'
      - 'contracttwin/**'
      - '**/*'
      - '*'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'commercial-legal-cockpit/**'
      - 'contracttwin/**'
      - '**/*'
      - '*'
  workflow_dispatch:

concurrency:
  group: commercial-legal-cockpit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  checks: read
  contents: read

jobs:
  validate:
    name: Cockpit validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: contracttwin
          POSTGRES_PASSWORD: contracttwin_ci
          POSTGRES_DB: contracttwin
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U contracttwin -d contracttwin"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://contracttwin:contracttwin_ci@localhost:5432/contracttwin
    defaults:
      run:
        working-directory: commercial-legal-cockpit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: commercial-legal-cockpit/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check database controls
        run: npm run db:check
      - name: Apply ContractTwin and Better Auth migrations
        run: npm run db:migrate
      - name: Verify migrations are idempotent
        run: npm run db:migrate
      - name: Provision disposable restricted runtime role
        id: ci-runtime
        env:
          CI_RUNTIME_ROLE_PROVISIONING: disposable-postgres-service
        run: npm run db:provision-ci-runtime
      - name: Prove database control invariants
        env:
          RUNTIME_DATABASE_URL: ${{ steps.ci-runtime.outputs.runtime_database_url }}
          CI_DATABASE_CONTROL_FIXTURE: disposable-postgres-service
        run: npm run test:db-controls
      - name: Prove application control boundaries
        run: npm run test:controls
      - name: Check frozen legal corpus
        run: npm run test:corpus
      - name: Check deterministic economics
        run: npm run test:economics
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        env:
          AUTH_REQUIRED: 'false'
          ALLOW_DEMO_ACCESS: 'true'
          LEGAL_RELIANCE_ENABLED: 'false'
        run: npm run build

  dependency-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: commercial-legal-cockpit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: commercial-legal-cockpit/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

  ci-gate:
    name: CI gate
    needs: validate
    if: always() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      checks: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check the gate rules on synthetic results
        run: python3 .github/scripts/ci_gate.py --self-test
      - name: Require the validation checks
        env:
          LOCAL_COCKPIT_RESULT: ${{ needs.validate.result }}
          GH_TOKEN: ${{ github.token }}
          GATE_EVENT: ${{ github.event_name }}
          # Pull request checks are stored on the branch tip. github.sha is the
          # temporary merge commit, and that commit has no check runs.
          CHECK_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/scripts/ci_gate.py
