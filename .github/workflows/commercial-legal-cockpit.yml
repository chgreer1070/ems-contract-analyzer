name: Commercial Legal Cockpit

on:
  push:
    branches:
      - build/ems-commercial-legal-cockpit
    paths:
      - 'commercial-legal-cockpit/**'
      - '.github/workflows/commercial-legal-cockpit.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'commercial-legal-cockpit/**'
      - '.github/workflows/commercial-legal-cockpit.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Cockpit validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: commercial-legal-cockpit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: commercial-legal-cockpit/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check database controls
        run: npm run db:check
      - name: Check deterministic economics
        run: npm run test:economics
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        env:
          AUTH_REQUIRED: 'false'
          ALLOW_DEMO_ACCESS: 'true'
          LEGAL_RELIANCE_ENABLED: 'false'
        run: npm run build
