name: Commercial Legal Cockpit

on:
  push:
    branches:
      - build/ems-commercial-legal-cockpit
    paths:
      - 'commercial-legal-cockpit/**'
      - '.github/workflows/commercial-legal-cockpit.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'commercial-legal-cockpit/**'
      - '.github/workflows/commercial-legal-cockpit.yml'

concurrency:
  group: commercial-legal-cockpit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    name: Cockpit validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: contracttwin
          POSTGRES_PASSWORD: contracttwin_ci
          POSTGRES_DB: contracttwin
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U contracttwin -d contracttwin"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://contracttwin:contracttwin_ci@localhost:5432/contracttwin
    defaults:
      run:
        working-directory: commercial-legal-cockpit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: commercial-legal-cockpit/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check database controls
        run: npm run db:check
      - name: Apply Better Auth and ContractTwin migrations
        run: npm run db:migrate
      - name: Verify migrations are idempotent
        run: npm run db:migrate
      - name: Prove database control invariants
        run: npm run test:db-controls
      - name: Check frozen legal corpus
        run: npm run test:corpus
      - name: Check deterministic economics
        run: npm run test:economics
      - name: TypeScript
        run: npm run typecheck
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Production build
        env:
          AUTH_REQUIRED: 'false'
          ALLOW_DEMO_ACCESS: 'true'
          LEGAL_RELIANCE_ENABLED: 'false'
        run: npm run build
      - name: Commit resolved dependency lockfile
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/build/ems-commercial-legal-cockpit'
        working-directory: .
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add commercial-legal-cockpit/package-lock.json
          if git diff --cached --quiet; then
            echo 'package-lock.json is already current.'
          else
            git commit -m 'chore: lock cockpit production dependencies'
            git push origin HEAD:build/ems-commercial-legal-cockpit
          fi
      - name: Capture generated dependency lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commercial-legal-cockpit-package-lock-${{ github.run_id }}
          path: commercial-legal-cockpit/package-lock.json
          if-no-files-found: error
          retention-days: 7
