name: Commercial Legal Cockpit

on:
  push:
    branches:
      - build/ems-commercial-legal-cockpit
    paths:
      - 'commercial-legal-cockpit/**'
      - '.github/workflows/commercial-legal-cockpit.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'commercial-legal-cockpit/**'
      - '.github/workflows/commercial-legal-cockpit.yml'

concurrency:
  group: commercial-legal-cockpit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Cockpit validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: contracttwin
          POSTGRES_PASSWORD: contracttwin_ci
          POSTGRES_DB: contracttwin
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U contracttwin -d contracttwin"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://contracttwin:contracttwin_ci@localhost:5432/contracttwin
    defaults:
      run:
        working-directory: commercial-legal-cockpit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: commercial-legal-cockpit/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check database controls
        run: npm run db:check
      - name: Apply Better Auth and ContractTwin migrations
        run: npm run db:migrate
      - name: Verify migrations are idempotent
        run: npm run db:migrate
      - name: Provision disposable restricted runtime role
        id: ci-runtime
        env:
          CI_RUNTIME_ROLE_PROVISIONING: disposable-postgres-service
        run: npm run db:provision-ci-runtime
      - name: Prove database control invariants
        env:
          RUNTIME_DATABASE_URL: ${{ steps.ci-runtime.outputs.runtime_database_url }}
        run: npm run test:db-controls
      - name: Prove application control boundaries
        run: npm run test:controls
      - name: Check frozen legal corpus
        run: npm run test:corpus
      - name: Check deterministic economics
        run: npm run test:economics
      - name: TypeScript
        run: npm run typecheck
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Production build
        env:
          AUTH_REQUIRED: 'false'
          ALLOW_DEMO_ACCESS: 'true'
          LEGAL_RELIANCE_ENABLED: 'false'
        run: npm run build
