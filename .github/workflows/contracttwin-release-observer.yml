name: ContractTwin Release Observer

on:
  workflow_run:
    workflows:
      - ContractTwin Release Attestation
    types:
      - completed

permissions:
  contents: write

jobs:
  record-failure:
    if: github.event.workflow_run.conclusion != 'success' && github.event.workflow_run.head_branch == 'build/ems-commercial-legal-cockpit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: build/ems-commercial-legal-cockpit
      - name: Record failed release evidence
        shell: bash
        run: |
          cat > contracttwin-release-failure.json <<EOF
          {
            "application": "ContractTwin / EMS Commercial Legal Cockpit",
            "testedSourceSha": "${{ github.event.workflow_run.head_sha }}",
            "workflowRunId": "${{ github.event.workflow_run.id }}",
            "workflowConclusion": "${{ github.event.workflow_run.conclusion }}",
            "recordedAtUtc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add contracttwin-release-failure.json
          git commit -m 'ci: record failed ContractTwin release attestation' || exit 0
          git push origin HEAD:build/ems-commercial-legal-cockpit
